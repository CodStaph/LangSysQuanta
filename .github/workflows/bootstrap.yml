name: bootstrap
on:
  push:
  pull_request:

jobs:
  linux-m0-m1a:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang strace
      - name: Build and run bootstrap tests
        run: |
          set +e
          bash -x ./bootstrap/ci/run-linux.sh > ci.log 2>&1
          rc=$?
          cat ci.log
          if [ $rc -ne 0 ]; then
            tail -n 10 ci.log | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit $rc
          fi
      - name: Upload CI log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-log
          path: ci.log

  # The Rust-side checker spike is built in CI. Dossiers A, B and C are now
  # hard gates (C reached 7/7 in W2; no continue-on-error).
  checker-spike:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: cargo --version && rustc --version
      - name: Dossiers A and B must pass
        run: |
          set -e
          cargo run --release --quiet --manifest-path tools/checker-spike/Cargo.toml -- dossiers/views
          cargo run --release --quiet --manifest-path tools/checker-spike/Cargo.toml -- dossiers/recursion
      - name: Conformance accept/reject corpus
        run: |
          set -e
          cargo run --release --quiet --manifest-path tools/checker-spike/Cargo.toml -- tests/conformance/accept
          cargo run --release --quiet --manifest-path tools/checker-spike/Cargo.toml -- tests/conformance/reject
      - name: EBNF syntax gate (00 §5 + B-LS)
        run: python tests/syntax/run.py
      - name: Dossier C (slab) must pass 7/7
        run: cargo run --release --quiet --manifest-path tools/checker-spike/Cargo.toml -- dossiers/slab
