name: bootstrap
on:
  push:
  pull_request:

jobs:
  linux-m0-m1a:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang strace
      - name: Build and run bootstrap tests
        run: |
          set +e
          bash -x ./bootstrap/ci/run-linux.sh > ci.log 2>&1
          rc=$?
          cat ci.log
          if [ $rc -ne 0 ]; then
            tail -n 10 ci.log | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit $rc
          fi
      - name: Upload CI log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-log
          path: ci.log

  # The Rust-side checker spike is built in CI. Dossiers A, B and C are now
  # hard gates (C reached 7/7 in W2; no continue-on-error).
  checker-spike:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: cargo --version && rustc --version
      - name: Dossiers A and B must pass
        run: |
          set -e
          cargo run --release --quiet --manifest-path tools/checker-spike/Cargo.toml -- dossiers/views
          cargo run --release --quiet --manifest-path tools/checker-spike/Cargo.toml -- dossiers/recursion
      - name: Conformance corpus (checker-spike legacy Q4/Q9)
        run: |
          set -e
          cargo run --release --quiet --manifest-path tools/checker-spike/Cargo.toml -- tests/conformance/checker-spike/accept
          cargo run --release --quiet --manifest-path tools/checker-spike/Cargo.toml -- tests/conformance/checker-spike/reject
      - name: EBNF syntax gate (00 §5 + B-LS)
        run: python tests/syntax/run.py
      - name: EBNF -> GBNF differential
        run: python tests/syntax/gbnf_diff.py
      - name: Design docs consistency (diagnostics registry, links, refs)
        run: python tools/doc-lint --strict
      - name: Diagnostic registry golden diff (only when local drafts exist)
        if: hashFiles('00-*.md') != ''
        run: python tools/diag-extract --check
      - name: L1 freeze manifest fingerprint
        run: python tools/freeze-hash --check
      - name: L-Redex grammar coverage (B3)
        run: python tools/grammar-coverage
      - name: ls-sem skeleton
        run: |
          set -e
          cargo fmt --manifest-path tools/ls-sem/Cargo.toml -- --check
          cargo test --quiet --manifest-path tools/ls-sem/Cargo.toml
          cargo run --quiet --manifest-path tools/ls-sem/Cargo.toml -- selftest
          cargo run --quiet --manifest-path tools/ls-sem/Cargo.toml -- demo
          cargo run --quiet --manifest-path tools/ls-sem/Cargo.toml -- targets
          cargo run --quiet --manifest-path tools/ls-sem/Cargo.toml -- abi x86_64-unknown-linux-gnu char
          cargo run --quiet --manifest-path tools/ls-sem/Cargo.toml -- caps
      - name: Dossier C (slab) must pass 7/7
        run: cargo run --release --quiet --manifest-path tools/checker-spike/Cargo.toml -- dossiers/slab
      - name: Conformance corpus (ls-sem R1-R8 gate)
        run: python tools/conformance-run

  # L3: Lean 4.6.0 machine-checks Term/State/Adequacy/Progress/Block/T4a
  # (no sorry; no sorryAx; only propext/Quot.sound).
  lean-term:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache elan toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-leanprover-lean4-v4.6.0
      - name: Install Lean 4.6.0 (elan)
        run: |
          if ! command -v lean >/dev/null 2>&1; then
            curl -sSfL https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.6.0
            echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          fi
      - name: L3 (Lean, no sorry)
        run: bash lean/check.sh
