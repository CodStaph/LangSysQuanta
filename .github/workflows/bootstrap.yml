name: bootstrap
on:
  push:
  pull_request:

jobs:
  linux-m0-m1a:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang strace
      - name: Build and run bootstrap tests
        run: |
          set +e
          bash -x ./bootstrap/ci/run-linux.sh > ci.log 2>&1
          rc=$?
          cat ci.log
          if [ $rc -ne 0 ]; then
            tail -n 10 ci.log | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit $rc
          fi
      - name: Upload CI log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-log
          path: ci.log
